<head>
    <style>
        body {
            background: #f1f1f1;
        }
        .main-card {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
        .error-url {
            color: #333;
            margin: 10px 0;
        }
        .traceback {
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <p>Xin chào {{ email }},</p>
        <p>Thông báo lỗi từ hệ thống MAILIX.VN. </p>
        <p class="error-url">URL: {{error_url}}</p>
        <p class="error-message">{{error_message}}</p>
        <pre class="traceback">{{error_detail}}</pre>
    </div>
</body>
