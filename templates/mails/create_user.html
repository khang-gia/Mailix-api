<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Created</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            padding: 20px;
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .header h1 {
            margin: 0;
            color: #ffcc00;
            font-size: 24px;
        }
        .content {
            margin-top: 20px;
            line-height: 1.6;
        }
        .info {
            margin-top: 15px;
            background: #f4f4f4;
            border-radius: 6px;
            padding: 15px;
        }
        .info p {
            margin: 5px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background-color: #0313B0;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
        }
        .btn-wrap {
            text-align: center;
            margin-top: 24px;
        }
        .fallback-link {
            margin-top: 10px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MAILIX</h1>
        </div>
        <div class="content">
            <p>An account has been created with this email.</p>
            <div class="info">
                <p><strong>Email:</strong> {{ email }}</p>
                <p><strong>Your mail box:</strong> {{ miab_mail }}</p>
                <p><strong>Username:</strong> {{ username }}</p>
                <p><strong>Password:</strong> {{ password }}</p>
            </div>
            <p>Please keep this information safe.</p>
            <div class="btn-wrap">
                <a href="{{ login_url }}" class="btn">Login now →</a>
            </div>
            <p class="fallback-link">
                Or copy this link: <a href="{{ login_url }}">{{ login_url }}</a>
            </p>
        </div>
        <div class="footer">
            &copy; {{ year }} MAILIX. All rights reserved.
        </div>
    </div>
</body>
</html>
